<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة المتجر الشاملة السحابية - NASRO STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, updateDoc, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDhtAe06W15Cv0EpCGa3xa3-X9yVVslG2Y",
            authDomain: "nasro-store.firebaseapp.com",
            projectId: "nasro-store",
            storageBucket: "nasro-store.firebasestorage.app",
            messagingSenderId: "878774398502",
            appId: "1:878774398502:web:b1f54e33066db9045e00e7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadCloudTelegramSettings() {
            try {
                const docRef = doc(db, "settings", "telegram");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('telegramToken').value = data.botToken || '';
                    document.getElementById('telegramChatId').value = data.chatId || '';
                }
            } catch (err) { console.error(err); }
        }
        window.loadCloudTelegramSettings = loadCloudTelegramSettings;

        window.saveCloudTelegramSettings = async function() {
            const botToken = document.getElementById('telegramToken').value.trim();
            const chatId = document.getElementById('telegramChatId').value.trim();
            try {
                await setDoc(doc(db, "settings", "telegram"), { botToken, chatId, updatedAt: new Date() }, { merge: true });
                alert('تم حفظ إعدادات تيليجرام سحابياً بنجاح!');
            } catch (err) { alert('خطأ: ' + err.message); }
        };

        onSnapshot(collection(db, "products"), (snapshot) => {
            document.getElementById('productCountHeader').innerText = `قائمة المنتجات (${snapshot.size})`;
            const tbody = document.getElementById('productsTableBody');
            if (snapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-400">لا توجد منتجات مضافة حالياً</td></tr>`;
                return;
            }
            let html = '';
            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const id = docSnap.id;
                html += `
                    <tr class="border-b border-gray-800/50 hover:bg-gray-800/30 transition">
                        <td class="p-4 flex items-center gap-3"><img src="${p.image}" class="w-10 h-10 object-cover rounded-lg border border-gray-700"><span class="font-bold text-white">${p.name}</span></td>
                        <td class="p-4 text-gray-300">${p.category || 'عام'}</td>
                        <td class="p-4 text-cyan-400 font-bold">${p.price} د.ج</td>
                        <td class="p-4"><span class="px-2 py-1 bg-cyan-500/10 text-cyan-400 rounded-md text-xs">${p.badge || 'بدون'}</span></td>
                        <td class="p-4 text-center">
                            <button onclick="deleteProductDoc('${id}')" class="px-3 py-1 bg-rose-500/20 text-rose-400 rounded-lg text-xs hover:bg-rose-500/30 transition"><i class="fa-solid fa-trash"></i> حذف</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        });

        onSnapshot(collection(db, "orders"), (snapshot) => {
            const container = document.getElementById('ordersContainer');
            if (snapshot.empty) {
                container.innerHTML = `<p class="text-gray-400 text-center py-8">لا توجد طلبات سحابية جديدة</p>`;
                return;
            }
            let html = '';
            snapshot.forEach((docSnap) => {
                const o = docSnap.data();
                const id = docSnap.id;
                const custName = o.customer ? o.customer.name : 'غير معروف';
                const custPhone = o.customer ? o.customer.phone : '';
                const custWilaya = o.customer ? o.customer.wilaya : '';
                const status = o.status || 'جديد';

                let statusBadge = `<span class="px-2.5 py-1 bg-amber-500/20 text-amber-400 text-[10px] font-bold rounded-full">⏳ قيد الانتظار</span>`;
                if (status === 'مؤكد') statusBadge = `<span class="px-2.5 py-1 bg-emerald-500/20 text-emerald-400 text-[10px] font-bold rounded-full">✅ تم المقبول (مؤكد)</span>`;
                else if (status === 'مرفوض') statusBadge = `<span class="px-2.5 py-1 bg-rose-500/20 text-rose-400 text-[10px] font-bold rounded-full">❌ تم الرفض</span>`;

                let itemsListHtml = o.items ? o.items.map(i => `<div class="text-xs text-cyan-300">📦 ${i.name} (العدد: ${i.quantity})</div>`).join('') : '';

                html += `
                    <div class="glass-panel p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border border-gray-800 shadow-xl">
                        <div class="space-y-2">
                            <div class="flex items-center gap-2">
                                <span class="px-2 py-0.5 bg-cyan-500/20 text-cyan-400 text-[10px] font-bold rounded font-mono">${o.id || id}</span>
                                ${statusBadge}
                                <span class="text-xs text-gray-400">${o.date || ''}</span>
                            </div>
                            <p class="font-black text-white text-base">👤 ${custName} <span class="text-cyan-400 font-normal text-xs">(${custPhone})</span></p>
                            <p class="text-xs text-gray-300">📍 الولاية: <strong class="text-white">${custWilaya}</strong></p>
                            <div class="bg-gray-900/60 p-2.5 rounded-xl border border-gray-800 space-y-1 mt-2">${itemsListHtml}<div class="text-xs font-black text-amber-400 pt-1 border-t border-gray-800">💰 الإجمالي: ${o.totalPrice} د.ج</div></div>
                        </div>
                        <div class="flex flex-wrap md:flex-col gap-2 w-full md:w-auto">
                            <button onclick="updateOrderStatus('${id}', 'مؤكد')" class="px-4 py-2 bg-emerald-500/25 text-emerald-300 border border-emerald-500/40 rounded-xl text-xs font-bold"><i class="fa-solid fa-check"></i> قبول الطلب</button>
                            <button onclick="updateOrderStatus('${id}', 'مرفوض')" class="px-4 py-2 bg-amber-500/25 text-amber-300 border border-amber-500/40 rounded-xl text-xs font-bold"><i class="fa-solid fa-xmark"></i> رفض الطلب</button>
                            <button onclick="deleteOrderDoc('${id}')" class="px-4 py-2 bg-rose-500/20 text-rose-400 rounded-xl text-xs"><i class="fa-solid fa-trash"></i> حذف</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        });

        window.updateOrderStatus = async function(id, newStatus) {
            await updateDoc(doc(db, "orders", id), { status: newStatus });
        };

        window.saveProductCloud = async function(e) {
            e.preventDefault();
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const category = document.getElementById('prodCategory').value;
            const badge = document.getElementById('prodBadge').value;
            const image = window.uploadedBase64Img || document.getElementById('prodImage').value;
            const desc = document.getElementById('prodDesc').value;

            if(!image) { alert('حدد صورة!'); return; }
            await addDoc(collection(db, "products"), { name, price, category, badge, image, desc, createdAt: serverTimestamp() });
            document.getElementById('productForm').reset();
            toggleProductForm();
            alert('تم نشر المنتج بنجاح!');
        };

        window.deleteProductDoc = async function(id) { if(confirm('حذف المنتج؟')) await deleteDoc(doc(db, "products", id)); };
        window.deleteOrderDoc = async function(id) { if(confirm('حذف الطلب؟')) await deleteDoc(doc(db, "orders", id)); };

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                loadCloudTelegramSettings();
            }
        });
    </script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass-panel { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <div id="loginModal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="glass-panel p-8 rounded-2xl max-w-md w-full border border-cyan-500/20 shadow-2xl">
            <h2 class="text-2xl font-bold text-white text-center mb-6">تسجيل الدخول للإدارة</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="loginPassword" required placeholder="كلمة المرور" class="w-full glass-input rounded-xl px-4 py-3 text-white">
                <button type="submit" class="w-full bg-cyan-500 font-bold py-3 rounded-xl text-gray-950">دخول اللوحة</button>
            </form>
        </div>
    </div>

    <div id="adminContent" class="hidden container mx-auto px-4 py-8 max-w-6xl">
        <header class="glass-panel rounded-2xl p-6 mb-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">لوحة إدارة المتجر السحابية</h1>
            <button onclick="logout()" class="px-4 py-2 bg-rose-500/10 text-rose-400 rounded-xl text-sm">تسجيل الخروج</button>
        </header>

        <div class="flex border-b border-gray-800 mb-8 overflow-x-auto justify-end">
            <button onclick="switchTab('orders')" id="tab-orders" class="px-6 py-3 font-medium border-b-2 border-cyan-500 text-cyan-400">الطلبات الواردة</button>
            <button onclick="switchTab('products')" id="tab-products" class="px-6 py-3 font-medium border-b-2 border-transparent text-gray-400">المنتجات</button>
            <button onclick="switchTab('settings')" id="tab-settings" class="px-6 py-3 font-medium border-b-2 border-transparent text-gray-400">الإعدادات</button>
        </div>

        <section id="sec-orders" class="space-y-4"><h2 class="text-xl font-bold text-white mb-4">قائمة الطلبات</h2><div id="ordersContainer" class="space-y-4"></div></section>

        <section id="sec-products" class="hidden space-y-6">
            <button onclick="toggleProductForm()" class="bg-cyan-500 font-bold px-5 py-2.5 rounded-full text-gray-950 text-sm">إضافة منتج جديد</button>
            <h2 class="text-xl font-bold text-white" id="productCountHeader">قائمة المنتجات (0)</h2>
            <div id="productFormBox" class="hidden glass-panel p-6 rounded-2xl space-y-4">
                <form id="productForm" onsubmit="saveProductCloud(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="prodName" required placeholder="اسم المنتج" class="glass-input rounded-xl px-4 py-2.5 text-white">
                        <input type="number" id="prodPrice" required placeholder="السعر" class="glass-input rounded-xl px-4 py-2.5 text-white">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <select id="prodCategory" class="glass-input rounded-xl px-4 py-2.5 text-white bg-gray-900">
                            <option value="أذرع التحكم (Controllers)">أذرع التحكم</option>
                            <option value="أجهزة الكونسول (Consoles)">أجهزة الكونسول</option>
                            <option value="سماعات وملحقات (Headsets)">الملحقات</option>
                        </select>
                        <select id="prodBadge" class="glass-input rounded-xl px-4 py-2.5 text-white bg-gray-900">
                            <option value="">بدون شارة</option><option value="جديد">جديد</option><option value="الأكثر مبيعاً">الأكثر مبيعاً</option>
                        </select>
                    </div>
                    <input type="url" id="prodImage" placeholder="رابط الصورة" class="w-full glass-input rounded-xl px-4 py-2 text-white">
                    <textarea id="prodDesc" rows="3" required placeholder="الوصف" class="w-full glass-input rounded-xl px-4 py-2.5 text-white"></textarea>
                    <button type="submit" class="bg-cyan-500 font-bold px-6 py-2.5 rounded-xl text-gray-950">حفظ بالسحابة</button>
                </form>
            </div>
            <div class="glass-panel rounded-2xl overflow-hidden"><table class="w-full text-right text-sm"><thead class="bg-gray-900 text-gray-400"><tr><th class="p-4">المنتج</th><th class="p-4">القسم</th><th class="p-4">السعر</th><th class="p-4">الشارة</th><th class="p-4 text-center">إجراءات</th></tr></thead><tbody id="productsTableBody"></tbody></table></div>
        </section>

        <section id="sec-settings" class="hidden space-y-6">
            <div class="glass-panel p-6 rounded-2xl max-w-2xl mx-auto space-y-4">
                <h3 class="font-bold text-white">إعدادات تيليجرام السحابية</h3>
                <input type="text" id="telegramToken" dir="ltr" placeholder="Bot Token" class="w-full glass-input rounded-xl px-4 py-2.5 text-white text-left">
                <input type="text" id="telegramChatId" dir="ltr" placeholder="Chat ID" class="w-full glass-input rounded-xl px-4 py-2.5 text-white text-left">
                <button onclick="saveCloudTelegramSettings()" class="w-full bg-sky-500 text-white font-bold py-2.5 rounded-xl">حفظ الإعدادات</button>
            </div>
        </section>
    </div>

    <script>
        window.uploadedBase64Img = "";
        function handleLogin(e) {
            e.preventDefault();
            if (document.getElementById('loginPassword').value === (localStorage.getItem('adminPasswordCustom') || 'admin123')) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                location.reload();
            } else alert('خطأ في كلمة المرور');
        }
        function logout() { sessionStorage.removeItem('isAdminLoggedIn'); location.reload(); }
        function switchTab(tab) {
            ['orders', 'products', 'settings'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "px-6 py-3 font-medium border-b-2 border-transparent text-gray-400";
            });
            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "px-6 py-3 font-medium border-b-2 border-cyan-500 text-cyan-400";
        }
        function toggleProductForm() { document.getElementById('productFormBox').classList.toggle('hidden'); }
    </script>
</body>
</html>
